<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History Guard Pro Settings</title><link rel="stylesheet" href="options.css"></head><body><main><header><img src="../icons/icon128.png"><div><h1>History Guard Pro</h1><p>Advanced Settings</p></div></header><section class="card"><h2>Privacy controls</h2><label><input id="siteWipe" type="checkbox"> Wipe website data khi Smart Rule yêu cầu</label><label><input id="deleteStartup" type="checkbox"> Wipe khi mở trình duyệt</label><label><input id="historyOnVisit" type="checkbox"> Tự động xóa lượt truy cập mới</label><h3>Wipe Now data</h3><label><input id="cache" type="checkbox"> Cache</label><label><input id="cookies" type="checkbox"> Cookies</label><label><input id="localStorage" type="checkbox"> Local Storage</label><label><input id="indexedDB" type="checkbox"> IndexedDB</label><label><input id="serviceWorkers" type="checkbox"> Service Workers</label><label>Theme <select id="theme"><option>midnight</option><option>ocean</option><option>emerald</option><option>purple</option><option>glass</option><option>minimal</option></select></label><label>Browser mode <select id="browserMode"><option value="auto">Auto Detect</option><option value="chrome">Chrome</option><option value="coccoc">Cốc Cốc</option><option value="chromium">Chromium</option></select></label><button id="save">Lưu cài đặt</button><span id="status"></span></section><section class="card"><h2>Backup</h2><p>Backup được xuất từ Popup. JSON không chứa mật khẩu/PIN gốc, chỉ lưu hash PIN.</p></section></main><script src="options.js"></script></body></html>
